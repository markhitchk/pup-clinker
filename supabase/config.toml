# Publishable keys are not user JWTs. These functions authenticate the public project key
# with @supabase/server, then require Pupeye's signed installation envelope/session.
[functions.pupeye-register]
verify_jwt = false

[functions.pupeye-auth-discord]
verify_jwt = false

[functions.pupeye-sync]
verify_jwt = false

[functions.pupeye-transaction]
verify_jwt = false

# Support/admin only. @supabase/server requires a Supabase secret key.
[functions.pupeye-support-migrate]
verify_jwt = false


# Support/admin only. The handler requires Supabase secret authentication.
[functions.pupeye-support-ban]
verify_jwt = false


# Signed installation status refresh; no active Pupeye session is required.
[functions.pupeye-enforcement-status]
verify_jwt = false

# Signed authenticated portable-save content attestation.
[functions.pupeye-save-attestation]
verify_jwt = false
# Signed new-device request carrying an authenticated portable-save migration claim.
[functions.pupeye-device-transfer]
verify_jwt = false



# T0 Pup Accounts use Discord OAuth plus the existing signed PupEye session/device proof.
[functions.pup-account]
verify_jwt = false

# Discord bot only. Secret-authenticated developer gifts and system messages.
[functions.pup-bot-gift]
verify_jwt = false

# Queue is signed separately: publishable key, Android P-256 proof and
# one-time database leases, not a Supabase Auth JWT.
[functions.pup-queue]
verify_jwt = false

# Administrative actions require a verified PupEye DEVELOPER session.
[functions.pup-queue-admin]
verify_jwt = false

# Monitoring is authenticated by an independent secret stored on the server.
[functions.pup-queue-monitor]
verify_jwt = false

# Existing signed beta account endpoints authenticate using PupEye sessions.
[functions.pup-beta-link]
verify_jwt = false

[functions.pup-credentials]
verify_jwt = false
