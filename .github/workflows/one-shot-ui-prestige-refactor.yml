name: One-shot UI prestige refactor

on:
  push:
    paths:
      - '.github/workflows/one-shot-ui-prestige-refactor.yml'
      - '.github/scripts/puppy_ui_refactor.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI refactor
        run: python3 .github/scripts/puppy_ui_refactor.py

      - name: Commit UI refactor
        run: |
          set -euo pipefail
          git config user.name "markhitchk"
          git config user.email "mark.hitchk@gmail.com"
          git add app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt app/build.gradle.kts
          git diff --cached --check
          git commit -m "Simplify UI and move prestige to its own screen"
          git push
