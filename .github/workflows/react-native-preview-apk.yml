name: Puppy Clicker Beta APK
# Creates an offline-launchable, debug-key-signed release-variant APK for the
# isolated beta package. This is NEVER a Play Store production release.
on:
  workflow_dispatch:
  push:
    branches: [main, feat/react-native-full-android]
    paths:
      - 'Mobile/**'
      # Do not cancel a valid queued APK for documentation-only commits.
      - '!Mobile/**/*.md'
      - '!Mobile/**/*.py'
      - '!Mobile/.gitignore'
      - '.github/workflows/react-native-preview-apk.yml'
concurrency:
  group: puppy-react-native-preview-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-safe-preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    env:
      PUPPY_NATIVE_BETA: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Dependencies are pinned in Mobile/package-lock.json.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Set monotonic beta Android versionCode
        run: echo "PUPPY_BETA_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Install Expo dependencies
        run: npm ci --no-audit --no-fund
      - name: Ensure beta package and launcher label cannot replace production
        run: |
          node --input-type=module -e "import c from './app.config.js';import a from './app.json' with {type:'json'}; const x=c({config:a.expo}); if(x.android.package!=='com.harleytg.puppyclicker.beta'||x.name!=='Puppy Clicker [Beta]')process.exit(1)"
      - name: Test migration guard and Kotlin parity fixtures
        run: npm test
      - name: Generate isolated beta Android project
        run: npx expo prebuild --platform android --no-install
      # assembleDebug omits the JS bundle and requires a running Metro server.
      # assembleRelease embeds index.android.bundle so the beta starts offline.
      # Expo's generated release variant is signed with the *debug* keystore;
      # keep the .beta package ID and do not publish this artifact to Play.
      - name: Build standalone beta APK with bundled JavaScript
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Verify standalone APK bundle, package, launcher label and signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo "::error::Beta release APK was not generated"; exit 1; }
          unzip -Z1 "$APK" | grep -Fx 'assets/index.android.bundle' > /dev/null || {
            echo "::error::index.android.bundle missing from APK; it will crash without Metro"
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.harleytg.puppyclicker.beta'" > /dev/null || {
            echo "::error::Unexpected package ID; refusing to publish beta artifact"
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "application-label:'Puppy Clicker [Beta]'" > /dev/null || {
            echo "::error::Unexpected launcher label"
            exit 1
          }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      # Publish the cryptographically verified and bundled APK BEFORE the
      # emulator smoke test. Hosted Android emulators can fail to boot for
      # infrastructure reasons (ADB broken pipe), which must not delete an
      # otherwise valid installable artifact.
      - name: Upload beta APK (not Play signed)
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-react-native-beta-apk
          path: Mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
      # An APK that verifies its signature can still fail PackageManager installation.
      # Exercise a real Android PackageManager install + launch as a best-effort
      # separate smoke test; emulator startup failure does not void signed APK.
      - name: Smoke-test APK install and launch on Android emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: Mobile
          script: |
            set -e
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell pm path com.harleytg.puppyclicker.beta
            adb shell monkey -p com.harleytg.puppyclicker.beta -c android.intent.category.LAUNCHER 1
            sleep 8
            adb shell pidof com.harleytg.puppyclicker.beta || {
              adb logcat -d -t 500 '*:E' AndroidRuntime:E ActivityManager:E || true
              echo "::error::Beta app crashed before its locked migration entry could display"
              exit 1
            }

