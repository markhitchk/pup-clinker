name: Superpowers Repair Verification

on:
  push:
    branches:
      - superpowers/puppy-repair-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPY_UPLOAD_KEYSTORE_B64: ${{ secrets.PUPPY_UPLOAD_KEYSTORE_B64 || secrets.PUPPY_KEYSTORE_B64 }}
  PUPPY_UPLOAD_STORE_PASSWORD: ${{ secrets.PUPPY_UPLOAD_STORE_PASSWORD || secrets.PUPPY_SIGNING_STORE_PASSWORD }}
  PUPPY_UPLOAD_KEY_ALIAS: ${{ secrets.PUPPY_UPLOAD_KEY_ALIAS || secrets.PUPPY_SIGNING_KEY_ALIAS }}
  PUPPY_UPLOAD_KEY_PASSWORD: ${{ secrets.PUPPY_UPLOAD_KEY_PASSWORD || secrets.PUPPY_SIGNING_KEY_PASSWORD }}
  PUPPY_UPLOAD_CERT_SHA256: 37:6A:B3:22:43:90:21:78:33:3A:87:C6:71:1C:48:1E:43:BF:2C:B2:D9:9F:DF:06:7B:3D:27:8A:6E:F8:98:14

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Rebuild generated sources
        run: gradle --no-daemon clean :app:generateProtectedPuppySources --stacktrace

      - name: Verify removed UI does not reappear
        shell: bash
        run: |
          set -euo pipefail
          GEN="app/build/generated/protected-puppies/source"
          ! grep -R -n -E 'Puppy Coins|15,250|birthdayYear|initialYear' "$GEN"
          ! grep -n 'StreamedPupEyeBranding' "$GEN/com/harleytg/puppyclicker/ui/theme/Theme.kt"
          test "$(grep -c 'V6TicketDropOverlay' "$GEN/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt")" -eq 1
          ! grep -n 'Added to Ticket Upgrades' "$GEN/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt"

      - name: Compile debug and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare Google Play upload signing when configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          vars=(
            PUPPY_UPLOAD_KEYSTORE_B64
            PUPPY_UPLOAD_STORE_PASSWORD
            PUPPY_UPLOAD_KEY_ALIAS
            PUPPY_UPLOAD_KEY_PASSWORD
          )
          configured=0
          for name in "${vars[@]}"; do
            if [ -n "${!name:-}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$configured" -ne 4 ]; then
            echo "::error::Google Play upload signing is only partially configured."
            exit 1
          fi

          keyfile="$RUNNER_TEMP/puppy-clicker-play-upload.p12"
          printf '%s' "$PUPPY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"

          actual="$(
            keytool -list -v               -keystore "$keyfile"               -alias "$PUPPY_UPLOAD_KEY_ALIAS"               -storepass "$PUPPY_UPLOAD_STORE_PASSWORD"               | awk -F'SHA256: ' '/SHA256:/{print $2; exit}'               | tr -d '\r'               | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(printf '%s' "$PUPPY_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Wrong Google Play upload key. Expected $expected but got $actual."
            exit 1
          fi

          echo "PUPPY_UPLOAD_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK compile gate
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Build release AAB
        run: gradle --no-daemon :app:bundleRelease --stacktrace

      - name: Verify Google Play upload AAB
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/bundle/release"
          AAB="$(find "$OUT" -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$AAB" && test -s "$AAB"
          jarsigner -verify -strict -verbose -certs "$AAB"
          actual="$(
            keytool -printcert -jarfile "$AAB"               | awk -F'SHA256: ' '/SHA256:/{print $2; exit}'               | tr -d '\r'               | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(printf '%s' "$PUPPY_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"
          test "$actual" = "$expected"

      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-superpowers-repair
          path: |
            App/app/build/outputs/apk/debug/*.apk
            App/app/build/outputs/apk/release/*.apk
            App/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
