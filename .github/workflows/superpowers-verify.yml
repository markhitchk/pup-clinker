name: Superpowers Repair Verification

on:
  push:
    branches:
      - superpowers/puppy-repair-2026-09-09
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPY_KEYSTORE_B64: ${{ secrets.PUPPY_KEYSTORE_B64 }}
  PUPPY_SIGNING_STORE_PASSWORD: ${{ secrets.PUPPY_SIGNING_STORE_PASSWORD }}
  PUPPY_SIGNING_KEY_ALIAS: ${{ secrets.PUPPY_SIGNING_KEY_ALIAS }}
  PUPPY_SIGNING_KEY_PASSWORD: ${{ secrets.PUPPY_SIGNING_KEY_PASSWORD }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run JVM tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Rebuild generated sources
        run: gradle --no-daemon clean :app:generateProtectedPuppySources --stacktrace

      - name: Verify removed UI does not reappear
        shell: bash
        run: |
          set -euo pipefail
          GEN="app/build/generated/protected-puppies/source"
          ! grep -R -n -E 'Puppy Coins|15,250|birthdayYear|initialYear' "$GEN"
          ! grep -n 'StreamedPupEyeBranding' "$GEN/com/harleytg/puppyclicker/ui/theme/Theme.kt"
          test "$(grep -c 'V6TicketDropOverlay' "$GEN/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt")" -eq 1
          ! grep -n 'Added to Ticket Upgrades' "$GEN/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt"

      - name: Compile debug and instrumentation APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Prepare permanent update signing when configured
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          vars=(
            PUPPY_KEYSTORE_B64
            PUPPY_SIGNING_STORE_PASSWORD
            PUPPY_SIGNING_KEY_ALIAS
            PUPPY_SIGNING_KEY_PASSWORD
          )
          configured=0
          for name in "${vars[@]}"; do
            if [ -n "${!name:-}" ]; then configured=$((configured + 1)); fi
          done
          if [ "$configured" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$configured" -ne 4 ]; then
            echo "::error::Permanent signing is only partially configured."
            exit 1
          fi
          keyfile="$RUNNER_TEMP/puppy-clicker-update-key.p12"
          printf '%s' "$PUPPY_KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"
          echo "PUPPY_SIGNING_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Verify permanent signature and v4 sidecar
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          IDSIG="$(find "$OUT" -maxdepth 1 -type f -name '*.idsig' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APK" && test -s "$APK"
          test -n "$IDSIG" && test -s "$IDSIG"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "Verified v4 sidecar: $IDSIG"

      - name: Upload verification APKs
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-superpowers-repair
          path: |
            App/app/build/outputs/apk/debug/*.apk
            App/app/build/outputs/apk/release/*.apk
            App/app/build/outputs/apk/release/*.idsig
          if-no-files-found: error
