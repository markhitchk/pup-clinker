name: Export clean Puppy Clicker repair APK

on:
  push:
    branches: [fix/v1-installable-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build source release
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Align and inspect APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p "$RUNNER_TEMP/release"
          "$BT/zipalign" -f -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/release/Puppy-Clicker-1.7.6-19-unsigned.apk"
          "$BT/zipalign" -c -P 16 -v 4 "$RUNNER_TEMP/release/Puppy-Clicker-1.7.6-19-unsigned.apk"
          "$BT/aapt" dump badging "$RUNNER_TEMP/release/Puppy-Clicker-1.7.6-19-unsigned.apk" | grep '^package:' | grep "name='com.harleytg.puppyclicker' versionCode='19' versionName='1.7.6'"
      - uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-1.7.6-19-clean-unsigned
          path: ${{ runner.temp }}/release/Puppy-Clicker-1.7.6-19-unsigned.apk
          if-no-files-found: error
          retention-days: 30
