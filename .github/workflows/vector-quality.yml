name: Puppy Vector Quality

on:
  push:
    branches: [main]
    paths:
      - 'App/app/src/main/puppy-svg/**'
      - 'App/app/src/main/java/com/harleytg/puppyclicker/ProtectedPuppyArt.kt'
      - 'App/app/src/main/java/com/harleytg/puppyclicker/PuppyVectorAlpha.kt'
      - 'App/tools/check_puppy_vectors.py'
      - 'App/tools/puppy_svg.py'
      - 'App/app/build.gradle.kts'
      - '.github/workflows/vector-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'App/app/src/main/puppy-svg/**'
      - 'App/app/src/main/java/com/harleytg/puppyclicker/ProtectedPuppyArt.kt'
      - 'App/app/src/main/java/com/harleytg/puppyclicker/PuppyVectorAlpha.kt'
      - 'App/tools/check_puppy_vectors.py'
      - 'App/tools/puppy_svg.py'
      - 'App/app/build.gradle.kts'
      - '.github/workflows/vector-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all protected puppy source vectors
        run: python tools/check_puppy_vectors.py --json vector-quality-report.json

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppy-vector-quality-report
          path: App/vector-quality-report.json
          if-no-files-found: warn
