name: Puppy Exchange CI

on:
  push:
    branches: [feature/puppy-exchange]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Compile instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
