name: PupEye Feature RED-GREEN

on:
  push:
    branches: [pupeye-global-ban]

permissions:
  contents: read

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run PupEye Edge Function tests when present
        shell: bash
        run: |
          shopt -s nullglob
          files=(supabase/functions/tests/*-test.ts)
          if (( ${#files[@]} )); then
            deno test --allow-all "${files[@]}"
          fi
      - name: Type-check PupEye Edge Functions
        run: |
          deno check \
            supabase/functions/pupeye-register/index.ts \
            supabase/functions/pupeye-auth-discord/index.ts \
            supabase/functions/pupeye-sync/index.ts \
            supabase/functions/pupeye-transaction/index.ts \
            supabase/functions/pupeye-enforcement-status/index.ts \
            supabase/functions/pupeye-support-ban/index.ts
      - name: Detect database changes
        id: db_changes
        shell: bash
        run: |
          if git diff --name-only HEAD^ HEAD | grep -Eq '^supabase/(migrations/|tests/.*\.sql$)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Start local Supabase
        if: steps.db_changes.outputs.changed == 'true'
        run: supabase start
      - name: Run PupEye database tests
        if: steps.db_changes.outputs.changed == 'true'
        run: supabase test db supabase/tests/pupeye_global_bans_test.sql
