name: Sync existing website styling to Android
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: website-style-sync
  cancel-in-progress: false

jobs:
  propose-website-colors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Read unchanged website design CSS and update native tokens
        env:
          GH_TOKEN: ${{ github.token }}
          PUPPY_WEBSITE_UI_REF: main
        run: node Mobile/scripts/sync-website-ui.mjs
      - name: Check for changed website style tokens
        id: diff
        run: |
          if git diff --quiet -- Mobile/src/production/websiteDesignTokens.js; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify Android source parity
        if: steps.diff.outputs.changed == 'true'
        run: |
          npm --prefix Mobile ci --no-audit --no-fund
          node Mobile/scripts/sync-website-ui.mjs --verify
          npm --prefix Mobile test
      - name: Propose Android-only website style update
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C sync/website-style
          git add Mobile/src/production/websiteDesignTokens.js
          git commit -m "chore(android): track unchanged website's canonical CSS colors"
          git push --force-with-lease origin HEAD:sync/website-style
          if ! gh pr view sync/website-style --json number >/dev/null 2>&1; then
            gh pr create --base main --head sync/website-style \
              --title "chore(android): match website UI colors" \
              --body "Android-only CSS-color token sync. Website remains unchanged. This does not automatically port browser HTML/CSS layouts; native screen parity remains separately tested." \
              || echo "::warning::PR creation may be disabled; inspect sync/website-style branch."
          fi
