name: Fix Puppy Roster Crash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-roster-crash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch roster portrait loading
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          activity = Path('app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt')
          text = activity.read_text()

          old = '''    val isV2 = styleId in V2_PUPPY_IDS

    Box(Modifier.size(size).clip(CircleShape).background(background), contentAlignment = Alignment.Center) {
        Image(
            painter = painterResource(v6PuppyDrawable(styleId)),
'''
          new = '''    val isV2 = styleId in V2_PUPPY_IDS
    // A malformed/unsupported optional puppy asset must never take down the whole collection screen.
    // Fall back to the stable original portrait while keeping the puppy roster/unlock intact.
    val portraitPainter = try {
        painterResource(v6PuppyDrawable(styleId))
    } catch (_: Throwable) {
        painterResource(R.drawable.source_pup)
    }

    Box(Modifier.size(size).clip(CircleShape).background(background), contentAlignment = Alignment.Center) {
        Image(
            painter = portraitPainter,
'''
          if old not in text:
              raise SystemExit('Portrait block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)
          activity.write_text(text)

          gradle = Path('app/build.gradle.kts')
          build = gradle.read_text()
          if 'versionCode = 13' not in build or 'versionName = "1.7.0"' not in build:
              raise SystemExit('Expected v1.7.0 build metadata not found')
          build = build.replace('versionCode = 13', 'versionCode = 14', 1)
          build = build.replace('versionName = "1.7.0"', 'versionName = "1.7.1"', 1)
          gradle.write_text(build)
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "Puppy Clicker Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt app/build.gradle.kts
          git commit -m "Fix puppy roster asset crash"
          git push origin HEAD:main
