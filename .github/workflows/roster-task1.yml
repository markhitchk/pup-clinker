name: Roster Task 1 One Shot

on:
  push:
    branches:
      - superpowers/puppy-roster-revamp-2026-09-09

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: run roster task 1 patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: superpowers/puppy-roster-revamp-2026-09-09
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Patch roster metadata stream
        run: python App/tools/patch_roster_task1.py
      - name: Run targeted JVM test
        working-directory: App
        run: gradle --no-daemon :app:testDebugUnitTest --tests "com.harleytg.puppyclicker.DynamicPuppyRosterTest" --stacktrace
      - name: Commit implementation and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm App/tools/patch_roster_task1.py .github/workflows/roster-task1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App/app/src/main/java/com/harleytg/puppyclicker/DynamicPuppyRoster.kt \
                  App/tools/patch_roster_task1.py \
                  .github/workflows/roster-task1.yml
          git commit -m "feat: expose dynamic roster asset metadata"
          git push origin HEAD:superpowers/puppy-roster-revamp-2026-09-09
