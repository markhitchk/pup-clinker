name: Apply Repair Patch

on:
  push:
    branches:
      - superpowers/puppy-repair-2026-09-09

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.head_commit.message == 'fix: retry ticket source repair'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: superpowers/puppy-repair-2026-09-09

      - name: Apply targeted ticket source patch
        working-directory: App
        run: python3 tools/finalize_ticket_overlay.py

      - name: Verify ticket source shape
        working-directory: App
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'delay(2_750)' app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt
          grep -n 'V6TicketDropOverlay' app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt
          ! grep -n 'Added to Ticket Upgrades' app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt
          ! grep -n '"ticket overlay"' tools/patch_puppy_ux.py
          grep -n 'ui-test-junit4' app/build.gradle.kts

      - name: Commit patched source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/app/src/main/java/com/harleytg/puppyclicker/PuppyClickerV6Activity.kt App/tools/patch_puppy_ux.py App/app/build.gradle.kts
          git diff --cached --quiet && exit 0
          git commit -m 'fix: keep ticket drops from shifting play layout'
          git push origin HEAD:superpowers/puppy-repair-2026-09-09
