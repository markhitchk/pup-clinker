name: Puppy Clicker Vulkan beta validation
# Feature-branch only: synchronize npm lockfile and build an isolated beta APK.
on:
  push:
    branches: [feat/android-vulkan-skia-graphite]
    paths:
      - 'Mobile/**'
      - '.github/workflows/vulkan-beta-verify.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-vulkan:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: Mobile
    env:
      PUPPY_NATIVE_BETA: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Sync dependency lockfile with Vulkan packages
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit regenerated Vulkan lockfile to feature branch
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Lock Expo 57 and Skia Graphite Vulkan dependencies"
            git push origin HEAD:feat/android-vulkan-skia-graphite
          fi
      - name: Install reproducible dependencies
        run: npm ci --no-audit --no-fund
      - name: Run native game regression tests
        run: npm test
      - name: Set isolated beta version code
        run: echo "PUPPY_BETA_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
      - name: Prebuild Vulkan Android beta
        run: npx expo prebuild --platform android --no-install
      - name: Build standalone beta APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Verify beta identity and JS bundle
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fx assets/index.android.bundle
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.harleytg.puppyclicker.beta'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
      - name: Publish beta APK
        uses: actions/upload-artifact@v6
        with:
          name: puppy-clicker-vulkan-beta-apk
          path: Mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
