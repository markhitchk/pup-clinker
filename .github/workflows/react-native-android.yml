name: React Native Android Migration
on:
  push:
    paths: ['Mobile/**', '.github/workflows/react-native-android.yml', 'docs/superpowers/**']
    branches: ['feat/react-native-full-android', 'main']
  pull_request:
    paths: ['Mobile/**', '.github/workflows/react-native-android.yml', 'docs/superpowers/**']
permissions:
  contents: read
jobs:
  verify-react-native:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund
      - name: Cross-platform game and identity tests
        run: npm test
      - name: Verify JS Android export
        run: npx expo export --platform android --output-dir dist
      - name: Verify native Android project can be generated
        run: npx expo prebuild --platform android --no-install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - name: Verify Kotlin native modules compile
        run: cd android && chmod +x gradlew && ./gradlew :app:compileDebugKotlin --no-daemon
