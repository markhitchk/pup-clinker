name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPY_UPLOAD_KEYSTORE_B64: ${{ secrets.PUPPY_UPLOAD_KEYSTORE_B64 || secrets.PUPPY_KEYSTORE_B64 }}
  PUPPY_UPLOAD_STORE_PASSWORD: ${{ secrets.PUPPY_UPLOAD_STORE_PASSWORD || secrets.PUPPY_SIGNING_STORE_PASSWORD }}
  PUPPY_UPLOAD_KEY_ALIAS: ${{ secrets.PUPPY_UPLOAD_KEY_ALIAS || secrets.PUPPY_SIGNING_KEY_ALIAS }}
  PUPPY_UPLOAD_KEY_PASSWORD: ${{ secrets.PUPPY_UPLOAD_KEY_PASSWORD || secrets.PUPPY_SIGNING_KEY_PASSWORD }}
  PUPPY_UPLOAD_CERT_SHA256: 37:6A:B3:22:43:90:21:78:33:3A:87:C6:71:1C:48:1E:43:BF:2C:B2:D9:9F:DF:06:7B:3D:27:8A:6E:F8:98:14

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for SVG compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Python patch regression tests
        run: python3 -m unittest tools.test_patch_puppy_exchange tools.test_patch_android_1_0_runner tools.test_png_integrity

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run JVM regression tests
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Compile Android instrumentation tests
        run: gradle --no-daemon :app:assembleDebugAndroidTest --stacktrace

      - name: Build unsigned release APK compile gate
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Prepare Google Play upload signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          vars=(
            PUPPY_UPLOAD_KEYSTORE_B64
            PUPPY_UPLOAD_STORE_PASSWORD
            PUPPY_UPLOAD_KEY_ALIAS
            PUPPY_UPLOAD_KEY_PASSWORD
          )

          configured=0
          for name in "${vars[@]}"; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Google Play upload signing secrets are not configured; producing an unsigned AAB compile artifact."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::Google Play upload signing is only partially configured. Set all four PUPPY_UPLOAD signing secrets."
            exit 1
          fi

          keyfile="$RUNNER_TEMP/puppy-clicker-play-upload.p12"
          printf '%s' "$PUPPY_UPLOAD_KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"

          actual="$(
            keytool -list -v               -keystore "$keyfile"               -alias "$PUPPY_UPLOAD_KEY_ALIAS"               -storepass "$PUPPY_UPLOAD_STORE_PASSWORD"               | awk -F'SHA256: ' '/SHA256:/{print $2; exit}'               | tr -d '\r'               | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(printf '%s' "$PUPPY_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"

          if [ -z "$actual" ]; then
            echo "::error::Unable to read the SHA-256 certificate fingerprint from the configured Google Play upload keystore."
            exit 1
          fi
          if [ "$actual" != "$expected" ]; then
            echo "::error::Wrong Google Play upload key. Expected SHA-256 $expected but configured keystore is $actual."
            exit 1
          fi

          echo "PUPPY_UPLOAD_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Verified Google Play upload certificate SHA-256: $actual"

      - name: Build Google Play upload bundle
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon :app:bundleRelease --stacktrace

      - name: Verify Google Play upload bundle signature
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/bundle/release"
          AAB="$(find "$OUT" -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$AAB"
          test -s "$AAB"

          jarsigner -verify -strict -verbose -certs "$AAB"

          actual="$(
            keytool -printcert -jarfile "$AAB"               | awk -F'SHA256: ' '/SHA256:/{print $2; exit}'               | tr -d '\r'               | tr '[:lower:]' '[:upper:]'
          )"
          expected="$(printf '%s' "$PUPPY_UPLOAD_CERT_SHA256" | tr '[:lower:]' '[:upper:]')"

          if [ "$actual" != "$expected" ]; then
            echo "::error::Signed AAB certificate mismatch. Expected $expected but got $actual."
            exit 1
          fi
          echo "Verified Play upload AAB signer: $actual"

      - name: Upload Google Play production bundle
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-play-upload-bundle
          path: App/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Build unsigned AAB when upload signing secrets are unavailable
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon :app:bundleRelease --stacktrace

      - name: Upload unsigned AAB compile artifact
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-unsigned-play-bundle
          path: App/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 3

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Run device tests on Android 14 / API 34. The API 35 image repeatedly
          # crashed the instrumentation process before JUnit discovery (0 tests),
          # while the APK and androidTest APK both compiled successfully.
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          working-directory: App
          script: |
            adb logcat -c
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace || { echo "::group::Instrumentation crash logcat"; adb logcat -d -v threadtime '*:E' AndroidRuntime:I ActivityManager:I TestRunner:I || true; echo "::endgroup::"; exit 1; }
