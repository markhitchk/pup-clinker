name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Export APK signing tool
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          mkdir -p build-tools-export
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" build-tools-export/apksigner.jar
          ls -lah app/build/outputs/apk/release build-tools-export

      - name: Upload unsigned release and signing tool
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-update-prep
          path: |
            app/build/outputs/apk/release/*.apk
            build-tools-export/apksigner.jar
          if-no-files-found: error
