name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPY_KEYSTORE_B64: ${{ secrets.PUPPY_KEYSTORE_B64 }}
  PUPPY_SIGNING_STORE_PASSWORD: ${{ secrets.PUPPY_SIGNING_STORE_PASSWORD }}
  PUPPY_SIGNING_KEY_ALIAS: ${{ secrets.PUPPY_SIGNING_KEY_ALIAS }}
  PUPPY_SIGNING_KEY_PASSWORD: ${{ secrets.PUPPY_SIGNING_KEY_PASSWORD }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for SVG compilation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare generated V6 integration
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:generateProtectedPuppySources --stacktrace
          GENERATED="app/build/generated/protected-puppies/source"
          test -d "$GENERATED"
          python3 tools/patch_seasonal_events.py "$GENERATED"
          python3 tools/patch_pupeye_security.py "$GENERATED"
          python3 tools/patch_puppy_ux.py "$GENERATED"
          python3 tools/patch_import_reload.py "$GENERATED"

      - name: Stamp v1.7.8 import hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          source = path.read_text(encoding="utf-8")
          old_code = 'versionCode = 20'
          old_name = 'versionName = "1.7.7"'
          if source.count(old_code) != 1 or source.count(old_name) != 1:
              raise SystemExit("Unexpected Android version anchors")
          source = source.replace(old_code, 'versionCode = 21', 1)
          source = source.replace(old_name, 'versionName = "1.7.8"', 1)
          path.write_text(source, encoding="utf-8")
          PY

      - name: Export Android apksigner tool
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          TOOL_DIR="$RUNNER_TEMP/apksigner-tool"
          mkdir -p "$TOOL_DIR/lib"
          cp "$APKSIGNER" "$TOOL_DIR/apksigner"
          cp "$(dirname "$APKSIGNER")/lib/apksigner.jar" "$TOOL_DIR/lib/apksigner.jar"
          chmod +x "$TOOL_DIR/apksigner"

      - name: Upload Android apksigner tool
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: ${{ runner.temp }}/apksigner-tool
          if-no-files-found: error

      - name: Prepare permanent update signing
        id: signing
        shell: bash
        run: |
          set -euo pipefail
          vars=(
            PUPPY_KEYSTORE_B64
            PUPPY_SIGNING_STORE_PASSWORD
            PUPPY_SIGNING_KEY_ALIAS
            PUPPY_SIGNING_KEY_PASSWORD
          )

          configured=0
          for name in "${vars[@]}"; do
            if [ -n "${!name:-}" ]; then
              configured=$((configured + 1))
            fi
          done

          if [ "$configured" -eq 0 ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Permanent signing secrets are not configured; producing an unsigned release for external signing."
            exit 0
          fi

          if [ "$configured" -ne 4 ]; then
            echo "::error::Permanent signing is only partially configured. Set all four PUPPY signing secrets."
            exit 1
          fi

          keyfile="$RUNNER_TEMP/puppy-clicker-update-key.p12"
          printf '%s' "$PUPPY_KEYSTORE_B64" | base64 --decode > "$keyfile"
          chmod 600 "$keyfile"
          test -s "$keyfile"

          echo "PUPPY_SIGNING_STORE_FILE=$keyfile" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Build updateable release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleRelease -x generateProtectedPuppySources --stacktrace

      - name: Verify permanent-signed APK and v4 sidecar
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/release"
          APK="$(find "$OUT" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          IDSIG="$(find "$OUT" -maxdepth 1 -type f -name '*.idsig' -print -quit)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          test -n "$APK"
          test -s "$APK"
          test -n "$IDSIG"
          test -s "$IDSIG"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"
          echo "APK Signature Scheme v4 sidecar: $IDSIG"

      - name: Upload updateable release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-updateable-release
          path: |
            App/app/build/outputs/apk/release/*.apk
            App/app/build/outputs/apk/release/*.idsig
          if-no-files-found: error

      - name: Build unsigned release when signing secrets are unavailable
        if: steps.signing.outputs.ready != 'true'
        run: gradle --no-daemon :app:assembleRelease -x generateProtectedPuppySources --stacktrace

      - name: Upload unsigned release for external signing
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-unsigned-release
          path: App/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
