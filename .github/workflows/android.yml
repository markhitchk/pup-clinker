name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK with v4 signing
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK and v4 sidecar
        shell: bash
        run: |
          set -euo pipefail
          OUT="app/build/outputs/apk/debug"
          APK="$OUT/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"

          echo "Build output:"
          ls -lah "$OUT"

          test -s "$APK"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          IDSIG="$(find "$OUT" -maxdepth 1 -type f -name '*.idsig' -print -quit)"
          test -n "$IDSIG"
          test -s "$IDSIG"
          echo "APK Signature Scheme v4 sidecar: $IDSIG"

      - name: Upload v4-signed APK
        uses: actions/upload-artifact@v4
        with:
          name: puppy-clicker-v4-signed
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/*.idsig
          if-no-files-found: error
